<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Type Archive decision system</title>
  <desc id="desc">A vague typography brief moves through documented signals, separate role scoring, controlled comparison, and a decision receipt.</desc>
  <rect width="1600" height="1000" fill="#f6efe4"/>
  <path d="M0 116H1600M0 884H1600" stroke="#171512" stroke-opacity=".12"/>
  <path d="M110 0V1000M1490 0V1000" stroke="#171512" stroke-opacity=".08"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171512">
    <text x="110" y="76" font-size="18" letter-spacing="4" opacity=".48">TYPE ARCHIVE / DECISION SYSTEM</text>
    <circle cx="1468" cy="69" r="9" fill="#ff6a3d"/>

    <text x="110" y="186" font-size="72" font-weight="600" letter-spacing="-3">Brief to evidence.</text>
    <text x="112" y="230" font-size="23" opacity=".58">The reasoning stays visible from first intent to final CSS.</text>

    <g transform="translate(110 312)">
      <rect width="250" height="410" rx="24" fill="#fffaf1" stroke="#171512" stroke-opacity=".14"/>
      <text x="28" y="42" font-size="14" letter-spacing="3" opacity=".38">01 / BRIEF</text>
      <text x="28" y="104" font-size="30" font-weight="600">Quiet precision.</text>
      <text x="28" y="146" font-size="30" font-weight="600">Clinical trust.</text>
      <text x="28" y="188" font-size="30" font-weight="600">Human, not soft.</text>
      <path d="M28 232H222" stroke="#171512" stroke-opacity=".12"/>
      <text x="28" y="270" font-size="14" opacity=".48">Plain-language intent</text>
      <text x="28" y="298" font-size="14" opacity=".48">No objective-taste claim</text>
      <rect x="28" y="338" width="146" height="42" rx="21" fill="#171512"/>
      <text x="51" y="365" font-size="13" letter-spacing="1.5" fill="#fffaf1">INTERPRET</text>
    </g>

    <path d="M382 517H430" stroke="#171512" stroke-width="2" stroke-opacity=".28"/>
    <path d="M418 509L430 517L418 525" fill="none" stroke="#171512" stroke-width="2" stroke-opacity=".28"/>

    <g transform="translate(452 312)">
      <rect width="300" height="410" rx="24" fill="#171512"/>
      <text x="28" y="42" font-size="14" letter-spacing="3" fill="#fffaf1" opacity=".4">02 / SIGNALS</text>
      <g font-size="15" fill="#fffaf1">
        <rect x="28" y="82" width="116" height="42" rx="21" fill="#fffaf1" fill-opacity=".10"/><text x="51" y="108">precise 92</text>
        <rect x="154" y="82" width="112" height="42" rx="21" fill="#fffaf1" fill-opacity=".10"/><text x="178" y="108">human 84</text>
        <rect x="28" y="136" width="122" height="42" rx="21" fill="#fffaf1" fill-opacity=".10"/><text x="51" y="162">clinical 79</text>
        <rect x="160" y="136" width="106" height="42" rx="21" fill="#fffaf1" fill-opacity=".10"/><text x="184" y="162">quiet 71</text>
      </g>
      <path d="M28 212H272" stroke="#fffaf1" stroke-opacity=".12"/>
      <text x="28" y="254" font-size="15" fill="#fffaf1" opacity=".52">14 documented signals</text>
      <text x="28" y="284" font-size="15" fill="#fffaf1" opacity=".52">Visible interpretation</text>
      <text x="28" y="314" font-size="15" fill="#fffaf1" opacity=".52">Context, not confidence</text>
      <circle cx="250" cy="362" r="9" fill="#ff6a3d"/>
    </g>

    <path d="M774 517H822" stroke="#171512" stroke-width="2" stroke-opacity=".28"/>
    <path d="M810 509L822 517L810 525" fill="none" stroke="#171512" stroke-width="2" stroke-opacity=".28"/>

    <g transform="translate(844 312)">
      <rect width="300" height="410" rx="24" fill="#fffaf1" stroke="#171512" stroke-opacity=".14"/>
      <text x="28" y="42" font-size="14" letter-spacing="3" opacity=".38">03 / ROLES</text>
      <g transform="translate(28 78)">
        <rect width="244" height="78" rx="14" fill="#f6efe4" stroke="#171512" stroke-opacity=".10"/>
        <text x="18" y="28" font-size="12" letter-spacing="2" opacity=".38">DISPLAY</text>
        <text x="18" y="57" font-size="24" font-weight="600">Instrument Serif</text>
      </g>
      <g transform="translate(28 170)">
        <rect width="244" height="78" rx="14" fill="#f6efe4" stroke="#171512" stroke-opacity=".10"/>
        <text x="18" y="28" font-size="12" letter-spacing="2" opacity=".38">INTERFACE</text>
        <text x="18" y="57" font-size="24" font-weight="600">Instrument Sans</text>
      </g>
      <g transform="translate(28 262)">
        <rect width="244" height="78" rx="14" fill="#f6efe4" stroke="#171512" stroke-opacity=".10"/>
        <text x="18" y="28" font-size="12" letter-spacing="2" opacity=".38">METADATA</text>
        <text x="18" y="57" font-size="21" font-family="monospace">IBM Plex Mono</text>
      </g>
      <text x="28" y="380" font-size="14" opacity=".48">Separate scoring and penalties</text>
    </g>

    <path d="M1166 517H1214" stroke="#171512" stroke-width="2" stroke-opacity=".28"/>
    <path d="M1202 509L1214 517L1202 525" fill="none" stroke="#171512" stroke-width="2" stroke-opacity=".28"/>

    <g transform="translate(1236 312)">
      <rect width="254" height="410" rx="24" fill="#ff6a3d"/>
      <text x="26" y="42" font-size="14" letter-spacing="3" opacity=".58">04 / RECEIPT</text>
      <text x="26" y="104" font-size="25" font-weight="600">Reasoning saved.</text>
      <path d="M26 132H228" stroke="#171512" stroke-opacity=".20"/>
      <g font-size="14" opacity=".72">
        <text x="26" y="174">✓ role rationale</text>
        <text x="26" y="208">✓ license and source</text>
        <text x="26" y="242">✓ visible tradeoffs</text>
        <text x="26" y="276">✓ rejected candidates</text>
        <text x="26" y="310">✓ CSS output</text>
      </g>
      <rect x="26" y="344" width="142" height="40" rx="20" fill="#171512"/>
      <text x="48" y="370" font-size="12" letter-spacing="1.4" fill="#fffaf1">DEFEND</text>
    </g>

    <text x="110" y="818" font-size="16" letter-spacing="2.5" opacity=".36">DISCOVER</text>
    <path d="M224 812H570" stroke="#171512" stroke-opacity=".18"/>
    <text x="608" y="818" font-size="16" letter-spacing="2.5" opacity=".36">DECIDE</text>
    <path d="M706 812H1058" stroke="#171512" stroke-opacity=".18"/>
    <text x="1096" y="818" font-size="16" letter-spacing="2.5" opacity=".36">DEFEND</text>

    <text x="110" y="938" font-size="15" opacity=".42">Deterministic recommendations · controlled comparison · visible licensing · restorable decisions</text>
  </g>
</svg>
