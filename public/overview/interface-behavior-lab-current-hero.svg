<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Interface Behavior Lab current landing experience</title>
  <desc id="desc">Current Interface Behavior Lab landing composition combining the project thesis with the live Intent specimen in its revealed state.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#11100d" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#f2efe5"/>
  <g stroke="#11100d" stroke-opacity=".035" stroke-width="1">
    <path d="M0 170H1600M0 340H1600M0 510H1600M0 680H1600M0 850H1600"/>
    <path d="M160 0V1000M320 0V1000M480 0V1000M640 0V1000M800 0V1000M960 0V1000M1120 0V1000M1280 0V1000M1440 0V1000"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#11100d">
    <text x="78" y="92" font-size="15" font-weight="700" letter-spacing="2.8" fill="#c72f1e">INTERACTION SYSTEM / 01</text>

    <text x="76" y="205" font-size="92" font-weight="800" letter-spacing="-5">THE BUTTON IS</text>
    <text x="76" y="300" font-size="92" font-weight="800" letter-spacing="-5">NO LONGER</text>
    <text x="76" y="395" font-size="92" font-weight="800" letter-spacing="-5">A SHAPE.</text>

    <text x="80" y="470" font-size="24" fill="#68635b">A coded laboratory for controls that communicate intention,</text>
    <text x="80" y="507" font-size="24" fill="#68635b">consequence, commitment, system state, and recovery.</text>

    <g transform="translate(80 560)">
      <rect width="520" height="76" rx="38" fill="#0c0b09" stroke="#8f8a80" stroke-width="2"/>
      <text x="28" y="34" font-size="17" fill="#fffdf8">RUN THE TWO-MINUTE TRIAL</text>
      <text x="28" y="55" font-size="10" letter-spacing="2.1" fill="#9c978d">SIX BEATS / NO PERSONAL DATA</text>
      <circle cx="476" cy="38" r="27" fill="#9b978f"/>
    </g>

    <text x="80" y="687" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c72f1e">OR BROWSE ALL SIX SPECIMENS →</text>
  </g>

  <g transform="translate(865 115)" filter="url(#softShadow)">
    <rect width="660" height="770" rx="18" fill="#0a0908"/>
    <rect x="52" y="44" width="312" height="38" fill="none" stroke="#3a3732"/>
    <text x="208" y="69" text-anchor="middle" fill="#f2efe5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">SPECIMEN 01 / INTENT</text>

    <g transform="translate(330 385)">
      <ellipse rx="218" ry="108" fill="none" stroke="#1746e8" stroke-opacity=".34" stroke-width="2"/>
      <ellipse rx="182" ry="88" fill="none" stroke="#245cff" stroke-opacity=".58" stroke-width="2"/>
      <ellipse rx="146" ry="68" fill="none" stroke="#2f65ff" stroke-opacity=".9" stroke-width="2"/>

      <rect x="-148" y="-34" width="296" height="68" rx="34" fill="#0c0b09" stroke="#2f65ff" stroke-width="2"/>
      <text x="-122" y="-4" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="14">SAVE TO JOURNAL</text>
      <text x="-122" y="17" fill="#2f65ff" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.4">2 CHANGES</text>
      <circle cx="112" cy="0" r="19" fill="#2f65ff"/>
    </g>

    <g transform="translate(156 592)">
      <rect width="350" height="62" rx="4" fill="#171512" stroke="#32302d"/>
      <text x="18" y="36" fill="#8f8a80" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.4">CURRENT STATE</text>
      <text x="147" y="36" fill="#7795ff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">REVEALED</text>
      <circle cx="326" cy="31" r="5" fill="#2f65ff"/>
    </g>

    <text x="52" y="722" fill="#77726a" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.5">ONE THING PERFORMS. ONE THING EXPLAINS. EVERYTHING ELSE WAITS.</text>
  </g>
</svg>
