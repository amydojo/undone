<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Controlled typography comparison</title>
  <desc id="desc">Three type candidates are compared under synchronized text, size, measure, line height, and theme across four contexts.</desc>
  <rect width="1400" height="900" fill="#f7f1e7"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171512">
    <text x="64" y="58" font-size="16" letter-spacing="3" opacity=".38">RECEIPT 02 / CONTROLLED COMPARISON</text>
    <circle cx="1328" cy="52" r="8" fill="#ff6a3d"/>
    <path d="M64 82H1336" stroke="#171512" stroke-opacity=".12"/>
    <text x="64" y="142" font-size="48" font-weight="600" letter-spacing="-2">Hold the variables still.</text>
    <text x="64" y="181" font-size="18" opacity=".56">The candidate changes. The evaluation conditions do not.</text>

    <g transform="translate(64 220)">
      <rect width="1272" height="82" rx="18" fill="#fffaf1" stroke="#171512" stroke-opacity=".12"/>
      <text x="24" y="28" font-size="11" letter-spacing="2" opacity=".34">CONTEXT</text>
      <g font-size="13">
        <rect x="24" y="40" width="88" height="28" rx="14" fill="#171512"/><text x="45" y="59" fill="#fffaf1">Display</text>
        <rect x="120" y="40" width="92" height="28" rx="14" fill="#efe7da"/><text x="139" y="59">Interface</text>
        <rect x="220" y="40" width="72" height="28" rx="14" fill="#efe7da"/><text x="242" y="59">Body</text>
        <rect x="300" y="40" width="92" height="28" rx="14" fill="#efe7da"/><text x="320" y="59">Metadata</text>
      </g>
      <g transform="translate(520 0)" font-size="12">
        <text x="0" y="27" letter-spacing="1.5" opacity=".34">SYNCED CONTROLS</text>
        <text x="0" y="57" opacity=".58">Text</text><text x="72" y="57" opacity=".58">64 px</text><text x="146" y="57" opacity=".58">28 ch</text><text x="220" y="57" opacity=".58">1.08</text><text x="286" y="57" opacity=".58">Light</text>
      </g>
      <rect x="1134" y="24" width="112" height="38" rx="19" fill="#ff6a3d"/>
      <text x="1158" y="49" font-size="12" letter-spacing="1.2">COMPARE 3</text>
    </g>

    <g transform="translate(64 330)">
      <g>
        <rect width="402" height="430" rx="20" fill="#fffaf1" stroke="#171512" stroke-opacity=".12"/>
        <text x="24" y="34" font-size="11" letter-spacing="2" opacity=".34">01 / INSTRUMENT SERIF</text>
        <path d="M24 58H378" stroke="#171512" stroke-opacity=".10"/>
        <text x="24" y="145" font-family="Georgia, serif" font-size="58" letter-spacing="-2">Objects remember</text>
        <text x="24" y="207" font-family="Georgia, serif" font-size="58" letter-spacing="-2">what people forget.</text>
        <path d="M24 248H378" stroke="#171512" stroke-opacity=".10"/>
        <text x="24" y="286" font-size="12" letter-spacing="1.6" opacity=".34">READ</text>
        <text x="24" y="320" font-size="14" opacity=".62">Quiet contrast · editorial structure</text>
        <text x="24" y="349" font-size="14" opacity=".62">Strong display role · open source</text>
        <rect x="24" y="378" width="118" height="30" rx="15" fill="#efe7da"/><text x="45" y="398" font-size="11">saved candidate</text>
      </g>
      <g transform="translate(435 0)">
        <rect width="402" height="430" rx="20" fill="#171512"/>
        <text x="24" y="34" font-size="11" letter-spacing="2" fill="#fffaf1" opacity=".34">02 / NEWSREADER</text>
        <path d="M24 58H378" stroke="#fffaf1" stroke-opacity=".10"/>
        <text x="24" y="145" font-family="Georgia, serif" font-size="58" font-style="italic" letter-spacing="-2" fill="#fffaf1">Objects remember</text>
        <text x="24" y="207" font-family="Georgia, serif" font-size="58" font-style="italic" letter-spacing="-2" fill="#fffaf1">what people forget.</text>
        <path d="M24 248H378" stroke="#fffaf1" stroke-opacity=".10"/>
        <text x="24" y="286" font-size="12" letter-spacing="1.6" fill="#fffaf1" opacity=".34">READ</text>
        <text x="24" y="320" font-size="14" fill="#fffaf1" opacity=".62">More literary · softer authority</text>
        <text x="24" y="349" font-size="14" fill="#fffaf1" opacity=".62">Higher expressive risk in UI</text>
        <rect x="24" y="378" width="118" height="30" rx="15" fill="#ff6a3d"/><text x="45" y="398" font-size="11">active candidate</text>
      </g>
      <g transform="translate(870 0)">
        <rect width="402" height="430" rx="20" fill="#fffaf1" stroke="#171512" stroke-opacity=".12"/>
        <text x="24" y="34" font-size="11" letter-spacing="2" opacity=".34">03 / SOURCE SERIF 4</text>
        <path d="M24 58H378" stroke="#171512" stroke-opacity=".10"/>
        <text x="24" y="145" font-family="Georgia, serif" font-size="58" font-weight="700" letter-spacing="-2">Objects remember</text>
        <text x="24" y="207" font-family="Georgia, serif" font-size="58" font-weight="700" letter-spacing="-2">what people forget.</text>
        <path d="M24 248H378" stroke="#171512" stroke-opacity=".10"/>
        <text x="24" y="286" font-size="12" letter-spacing="1.6" opacity=".34">READ</text>
        <text x="24" y="320" font-size="14" opacity=".62">More robust · less distinctive</text>
        <text x="24" y="349" font-size="14" opacity=".62">Broad language support</text>
        <rect x="24" y="378" width="118" height="30" rx="15" fill="#efe7da"/><text x="45" y="398" font-size="11">saved candidate</text>
      </g>
    </g>

    <text x="64" y="820" font-size="13" opacity=".42">Synchronized: specimen text · size · measure · line height · theme. Contexts: display · interface · body · metadata.</text>
  </g>
</svg>
