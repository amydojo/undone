<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Responsible font substitution</title>
  <desc id="desc">A premium reference is compared with an accessible alternative through preserved traits, changed traits, licensing, role fit, and failure cases.</desc>
  <rect width="1400" height="900" fill="#f7f1e7"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171512">
    <text x="64" y="58" font-size="16" letter-spacing="3" opacity=".38">RECEIPT 03 / RESPONSIBLE SUBSTITUTION</text>
    <circle cx="1328" cy="52" r="8" fill="#ff6a3d"/>
    <path d="M64 82H1336" stroke="#171512" stroke-opacity=".12"/>
    <text x="64" y="142" font-size="48" font-weight="600" letter-spacing="-2">Replace the function, not the fiction.</text>
    <text x="64" y="181" font-size="18" opacity=".56">An alternative is documented as a tradeoff. It is never presented as an exact duplicate.</text>

    <g transform="translate(64 234)">
      <rect width="420" height="474" rx="22" fill="#171512"/>
      <text x="28" y="40" font-size="12" letter-spacing="2.2" fill="#fffaf1" opacity=".38">PREMIUM REFERENCE</text>
      <text x="28" y="96" font-size="38" font-weight="600" fill="#fffaf1">Söhne</text>
      <text x="28" y="134" font-size="15" fill="#fffaf1" opacity=".50">Commercial license · official source required</text>
      <path d="M28 164H392" stroke="#fffaf1" stroke-opacity=".10"/>
      <text x="28" y="216" font-size="46" font-weight="600" letter-spacing="-2" fill="#fffaf1">Measured utility.</text>
      <text x="28" y="272" font-size="20" fill="#fffaf1" opacity=".64">Compact proportions</text>
      <text x="28" y="306" font-size="20" fill="#fffaf1" opacity=".64">Neutral authority</text>
      <text x="28" y="340" font-size="20" fill="#fffaf1" opacity=".64">Dense interface rhythm</text>
      <rect x="28" y="392" width="184" height="42" rx="21" fill="#fffaf1" fill-opacity=".10"/>
      <text x="52" y="419" font-size="12" letter-spacing="1.5" fill="#fffaf1">REFERENCE ONLY</text>
    </g>

    <g transform="translate(512 378)">
      <circle cx="62" cy="62" r="62" fill="#ff6a3d"/>
      <text x="30" y="54" font-size="11" letter-spacing="1.6">TRANSLATE</text>
      <text x="30" y="78" font-size="11" letter-spacing="1.6">TRAITS</text>
      <path d="M132 62H190" stroke="#171512" stroke-width="2" stroke-opacity=".28"/>
      <path d="M178 54L190 62L178 70" fill="none" stroke="#171512" stroke-width="2" stroke-opacity=".28"/>
    </g>

    <g transform="translate(730 234)">
      <rect width="606" height="474" rx="22" fill="#fffaf1" stroke="#171512" stroke-opacity=".12"/>
      <text x="28" y="40" font-size="12" letter-spacing="2.2" opacity=".38">ACCESSIBLE ALTERNATIVE</text>
      <text x="28" y="96" font-size="38" font-weight="600">Inter</text>
      <text x="28" y="134" font-size="15" opacity=".52">Open source · SIL Open Font License 1.1</text>
      <path d="M28 164H578" stroke="#171512" stroke-opacity=".10"/>

      <g transform="translate(28 192)">
        <text x="0" y="0" font-size="12" letter-spacing="1.8" opacity=".34">PRESERVED</text>
        <text x="0" y="34" font-size="15" opacity=".68">✓ high interface legibility</text>
        <text x="0" y="64" font-size="15" opacity=".68">✓ neutral working tone</text>
        <text x="0" y="94" font-size="15" opacity=".68">✓ broad weight range</text>
      </g>

      <g transform="translate(300 192)">
        <text x="0" y="0" font-size="12" letter-spacing="1.8" opacity=".34">CHANGED</text>
        <text x="0" y="34" font-size="15" opacity=".68">• wider, more open rhythm</text>
        <text x="0" y="64" font-size="15" opacity=".68">• less proprietary character</text>
        <text x="0" y="94" font-size="15" opacity=".68">• softer compactness</text>
      </g>

      <path d="M28 314H578" stroke="#171512" stroke-opacity=".10"/>
      <text x="28" y="350" font-size="12" letter-spacing="1.8" opacity=".34">WHERE IT MAY FAIL</text>
      <text x="28" y="382" font-size="15" opacity=".62">Brand systems that depend on Söhne's exact proportions and proprietary tone.</text>
      <rect x="28" y="414" width="196" height="38" rx="19" fill="#ff6a3d"/>
      <text x="53" y="439" font-size="12" letter-spacing="1.4">RESPONSIBLE MATCH</text>
    </g>

    <g transform="translate(64 748)">
      <rect width="1272" height="82" rx="18" fill="#efe7da"/>
      <text x="24" y="31" font-size="11" letter-spacing="2" opacity=".34">SUBSTITUTION CONTRACT</text>
      <text x="24" y="58" font-size="14" opacity=".62">What is preserved · what changes · license difference · role fit · failure case · official source</text>
      <text x="1022" y="53" font-size="12" letter-spacing="1.5" opacity=".46">NO EXACT-DUPE CLAIM</text>
    </g>
  </g>
</svg>
