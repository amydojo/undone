<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Type DNA recommendation model</title>
  <desc id="desc">A documented brief interpretation flows into separate display, interface, and metadata role scoring with visible contributions and penalties.</desc>
  <rect width="1400" height="900" fill="#f7f1e7"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171512">
    <text x="64" y="58" font-size="16" letter-spacing="3" opacity=".38">RECEIPT 01 / TYPE DNA RECOMMENDATION MODEL</text>
    <circle cx="1328" cy="52" r="8" fill="#ff6a3d"/>
    <path d="M64 82H1336" stroke="#171512" stroke-opacity=".12"/>
    <text x="64" y="142" font-size="48" font-weight="600" letter-spacing="-2">A recommendation that can explain itself.</text>
    <text x="64" y="181" font-size="18" opacity=".56">Contextual fit is separated from universal quality. Every role exposes positive and negative evidence.</text>

    <g transform="translate(64 238)">
      <rect width="280" height="522" rx="20" fill="#fffaf1" stroke="#171512" stroke-opacity=".12"/>
      <text x="24" y="38" font-size="12" letter-spacing="2.4" opacity=".38">INPUT / BRIEF</text>
      <text x="24" y="92" font-size="28" font-weight="600">Quiet precision</text>
      <text x="24" y="127" font-size="28" font-weight="600">Clinical trust</text>
      <text x="24" y="162" font-size="28" font-weight="600">Human restraint</text>
      <path d="M24 198H256" stroke="#171512" stroke-opacity=".10"/>
      <text x="24" y="235" font-size="12" letter-spacing="2" opacity=".38">INTERPRETED SIGNALS</text>
      <g font-size="14">
        <rect x="24" y="262" width="108" height="38" rx="19" fill="#ff6a3d"/><text x="45" y="286">precise 92</text>
        <rect x="140" y="262" width="102" height="38" rx="19" fill="#efe7da"/><text x="163" y="286">human 84</text>
        <rect x="24" y="310" width="112" height="38" rx="19" fill="#efe7da"/><text x="46" y="334">clinical 79</text>
        <rect x="144" y="310" width="94" height="38" rx="19" fill="#efe7da"/><text x="169" y="334">quiet 71</text>
      </g>
      <path d="M24 384H256" stroke="#171512" stroke-opacity=".10"/>
      <text x="24" y="422" font-size="13" opacity=".52">14-signal controlled vocabulary</text>
      <text x="24" y="450" font-size="13" opacity=".52">Plain-language evidence</text>
      <text x="24" y="478" font-size="13" opacity=".52">No statistical confidence claim</text>
    </g>

    <path d="M366 500H416" stroke="#171512" stroke-width="2" stroke-opacity=".24"/>
    <path d="M404 492L416 500L404 508" fill="none" stroke="#171512" stroke-width="2" stroke-opacity=".24"/>

    <g transform="translate(438 238)">
      <rect width="898" height="522" rx="20" fill="#171512"/>
      <text x="26" y="38" font-size="12" letter-spacing="2.4" fill="#fffaf1" opacity=".38">ROLE-SPECIFIC MODEL</text>
      <g transform="translate(26 76)">
        <rect width="270" height="392" rx="16" fill="#fffaf1" fill-opacity=".06" stroke="#fffaf1" stroke-opacity=".12"/>
        <text x="20" y="34" font-size="12" letter-spacing="2" fill="#fffaf1" opacity=".4">DISPLAY</text>
        <text x="20" y="77" font-size="25" font-weight="600" fill="#fffaf1">Instrument Serif</text>
        <text x="20" y="112" font-size="14" fill="#fffaf1" opacity=".48">score 86 / contextual fit</text>
        <path d="M20 136H250" stroke="#fffaf1" stroke-opacity=".10"/>
        <text x="20" y="169" font-size="12" letter-spacing="1.6" fill="#fffaf1" opacity=".34">CONTRIBUTIONS</text>
        <text x="20" y="201" font-size="14" fill="#fffaf1" opacity=".68">+ precise signal overlap</text>
        <text x="20" y="230" font-size="14" fill="#fffaf1" opacity=".68">+ editorial display range</text>
        <text x="20" y="259" font-size="14" fill="#fffaf1" opacity=".68">+ open-source access</text>
        <text x="20" y="301" font-size="12" letter-spacing="1.6" fill="#fffaf1" opacity=".34">PENALTY</text>
        <text x="20" y="333" font-size="14" fill="#ff9b7d">− restrained contrast</text>
      </g>
      <g transform="translate(314 76)">
        <rect width="270" height="392" rx="16" fill="#fffaf1" fill-opacity=".06" stroke="#fffaf1" stroke-opacity=".12"/>
        <text x="20" y="34" font-size="12" letter-spacing="2" fill="#fffaf1" opacity=".4">INTERFACE</text>
        <text x="20" y="77" font-size="25" font-weight="600" fill="#fffaf1">Instrument Sans</text>
        <text x="20" y="112" font-size="14" fill="#fffaf1" opacity=".48">score 91 / contextual fit</text>
        <path d="M20 136H250" stroke="#fffaf1" stroke-opacity=".10"/>
        <text x="20" y="169" font-size="12" letter-spacing="1.6" fill="#fffaf1" opacity=".34">CONTRIBUTIONS</text>
        <text x="20" y="201" font-size="14" fill="#fffaf1" opacity=".68">+ interface suitability</text>
        <text x="20" y="230" font-size="14" fill="#fffaf1" opacity=".68">+ human precision</text>
        <text x="20" y="259" font-size="14" fill="#fffaf1" opacity=".68">+ role distinction</text>
        <text x="20" y="301" font-size="12" letter-spacing="1.6" fill="#fffaf1" opacity=".34">PENALTY</text>
        <text x="20" y="333" font-size="14" fill="#ff9b7d">− low expressive range</text>
      </g>
      <g transform="translate(602 76)">
        <rect width="270" height="392" rx="16" fill="#fffaf1" fill-opacity=".06" stroke="#fffaf1" stroke-opacity=".12"/>
        <text x="20" y="34" font-size="12" letter-spacing="2" fill="#fffaf1" opacity=".4">METADATA</text>
        <text x="20" y="77" font-size="23" font-family="monospace" fill="#fffaf1">IBM Plex Mono</text>
        <text x="20" y="112" font-size="14" fill="#fffaf1" opacity=".48">score 88 / contextual fit</text>
        <path d="M20 136H250" stroke="#fffaf1" stroke-opacity=".10"/>
        <text x="20" y="169" font-size="12" letter-spacing="1.6" fill="#fffaf1" opacity=".34">CONTRIBUTIONS</text>
        <text x="20" y="201" font-size="14" fill="#fffaf1" opacity=".68">+ technical clarity</text>
        <text x="20" y="230" font-size="14" fill="#fffaf1" opacity=".68">+ useful mono contrast</text>
        <text x="20" y="259" font-size="14" fill="#fffaf1" opacity=".68">+ metadata suitability</text>
        <text x="20" y="301" font-size="12" letter-spacing="1.6" fill="#fffaf1" opacity=".34">PENALTY</text>
        <text x="20" y="333" font-size="14" fill="#ff9b7d">− category repetition risk</text>
      </g>
      <text x="26" y="500" font-size="13" fill="#fffaf1" opacity=".42">Deterministic output · visible evidence · role-level rejection and restoration</text>
    </g>

    <text x="64" y="832" font-size="13" opacity=".42">Evidence level: implementation and model contract. No claim that the model identifies the objectively best typeface.</text>
  </g>
</svg>
