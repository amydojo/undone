<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Decision Receipt and verification contract</title>
  <desc id="desc">A final typography decision receipt sits beside engineering and evidence contracts, separating implemented proof from unearned human outcomes.</desc>
  <rect width="1400" height="900" fill="#171512"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="58" font-size="16" letter-spacing="3" fill="#fffaf1" opacity=".38">RECEIPT 04 / DECISION + VERIFICATION CONTRACT</text>
    <circle cx="1328" cy="52" r="8" fill="#ff6a3d"/>
    <path d="M64 82H1336" stroke="#fffaf1" stroke-opacity=".12"/>
    <text x="64" y="142" font-size="48" font-weight="600" letter-spacing="-2" fill="#fffaf1">The reasoning is the artifact.</text>
    <text x="64" y="181" font-size="18" fill="#fffaf1" opacity=".56">The final choice, its limits, and the evidence behind it remain attached.</text>

    <g transform="translate(64 228)" fill="#171512">
      <rect width="760" height="560" rx="22" fill="#fffaf1"/>
      <rect width="760" height="9" rx="5" fill="#ff6a3d"/>
      <text x="30" y="48" font-size="12" letter-spacing="2.2" opacity=".38">TYPE ARCHIVE / DECISION 0048</text>
      <text x="30" y="100" font-size="30" font-weight="600">Instrument Serif · Instrument Sans · IBM Plex Mono</text>
      <text x="30" y="134" font-size="15" opacity=".52">Quiet precision · clinical trust · human restraint</text>
      <path d="M30 164H730" stroke="#171512" stroke-opacity=".10"/>

      <g transform="translate(30 198)">
        <text x="0" y="0" font-size="11" letter-spacing="1.9" opacity=".34">ROLE EVIDENCE</text>
        <text x="0" y="33" font-size="14" opacity=".68">Display: expressive structure with restrained contrast</text>
        <text x="0" y="62" font-size="14" opacity=".68">Interface: readable, neutral, and human under dense use</text>
        <text x="0" y="91" font-size="14" opacity=".68">Metadata: technical contrast without category conflict</text>
      </g>

      <g transform="translate(30 330)">
        <rect width="330" height="120" rx="14" fill="#f6efe4"/>
        <text x="18" y="28" font-size="11" letter-spacing="1.8" opacity=".34">TRADEOFF</text>
        <text x="18" y="59" font-size="14" opacity=".66">Display character is reduced to protect</text>
        <text x="18" y="84" font-size="14" opacity=".66">interface clarity and role separation.</text>
      </g>
      <g transform="translate(378 330)">
        <rect width="352" height="120" rx="14" fill="#f6efe4"/>
        <text x="18" y="28" font-size="11" letter-spacing="1.8" opacity=".34">REJECTED</text>
        <text x="18" y="59" font-size="14" opacity=".66">Bodoni Moda</text>
        <text x="18" y="84" font-size="14" opacity=".66">Role contrast too severe for the brief.</text>
      </g>

      <path d="M30 480H730" stroke="#171512" stroke-opacity=".10"/>
      <text x="30" y="515" font-size="11" letter-spacing="1.8" opacity=".34">OUTPUT</text>
      <text x="30" y="545" font-size="14" font-family="monospace" opacity=".64">font-family: &quot;Instrument Sans&quot;, Arial, sans-serif;</text>
    </g>

    <g transform="translate(852 228)">
      <rect width="484" height="560" rx="22" fill="#fffaf1" fill-opacity=".06" stroke="#fffaf1" stroke-opacity=".12"/>
      <text x="28" y="42" font-size="12" letter-spacing="2.2" fill="#fffaf1" opacity=".38">VERIFICATION CONTRACT</text>
      <g transform="translate(28 78)">
        <rect width="428" height="68" rx="14" fill="#fffaf1" fill-opacity=".07"/>
        <circle cx="28" cy="34" r="8" fill="#ff6a3d"/>
        <text x="52" y="30" font-size="14" fill="#fffaf1" opacity=".82">Data and schema</text>
        <text x="52" y="51" font-size="12" fill="#fffaf1" opacity=".42">migration · validation · canonical records</text>
      </g>
      <g transform="translate(28 158)">
        <rect width="428" height="68" rx="14" fill="#fffaf1" fill-opacity=".07"/>
        <circle cx="28" cy="34" r="8" fill="#ff6a3d"/>
        <text x="52" y="30" font-size="14" fill="#fffaf1" opacity=".82">Model behavior</text>
        <text x="52" y="51" font-size="12" fill="#fffaf1" opacity=".42">determinism · penalties · recovery</text>
      </g>
      <g transform="translate(28 238)">
        <rect width="428" height="68" rx="14" fill="#fffaf1" fill-opacity=".07"/>
        <circle cx="28" cy="34" r="8" fill="#ff6a3d"/>
        <text x="52" y="30" font-size="14" fill="#fffaf1" opacity=".82">Product quality</text>
        <text x="52" y="51" font-size="12" fill="#fffaf1" opacity=".42">browser · accessibility · performance</text>
      </g>
      <g transform="translate(28 318)">
        <rect width="428" height="68" rx="14" fill="#fffaf1" fill-opacity=".07"/>
        <circle cx="28" cy="34" r="8" fill="#ff6a3d"/>
        <text x="52" y="30" font-size="14" fill="#fffaf1" opacity=".82">Privacy and analytics</text>
        <text x="52" y="51" font-size="12" fill="#fffaf1" opacity=".42">event allowlists · free text excluded</text>
      </g>
      <path d="M28 420H456" stroke="#fffaf1" stroke-opacity=".10"/>
      <text x="28" y="456" font-size="11" letter-spacing="1.8" fill="#fffaf1" opacity=".34">EVIDENCE BOUNDARY</text>
      <text x="28" y="487" font-size="13" fill="#fffaf1" opacity=".62">Implemented proof is visible.</text>
      <text x="28" y="512" font-size="13" fill="#fffaf1" opacity=".62">Human usability outcomes remain unearned.</text>
      <text x="28" y="537" font-size="13" fill="#ff9b7d">Latest browser suite is not claimed green.</text>
    </g>

    <text x="64" y="842" font-size="13" fill="#fffaf1" opacity=".42">The receipt preserves the decision trail. The verification contract preserves the limits of the claim.</text>
  </g>
</svg>
