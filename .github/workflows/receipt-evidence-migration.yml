name: Receipt evidence migration

on:
  push:
    branches:
      - feature/receipt-evidence-differentiation

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.event.head_commit.message == 'Run receipt evidence migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/receipt-evidence-differentiation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/apply-receipt-evidence-patch.mjs
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:screens:headless
      - run: git diff --check
      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/portfolio/ReceiptVisualGallery.jsx src/data/records.js tests/receipt-visual-qa.spec.js
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
          else
            git commit -m "Apply receipt evidence differentiation"
            git push origin HEAD:feature/receipt-evidence-differentiation
          fi
