name: Receipt evidence QA

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    if: github.head_ref == 'feature/receipt-evidence-differentiation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/receipt-evidence-differentiation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:screens:headless
      - run: git diff --check
