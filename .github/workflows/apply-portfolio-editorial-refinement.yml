name: Apply portfolio editorial refinement

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'feature/portfolio-editorial-refinement'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/portfolio-editorial-refinement
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply editorial refinement
        id: migration
        shell: bash
        run: |
          set +e
          python scripts/apply-portfolio-editorial-refinement.py > migration-output.txt 2>&1
          status=$?
          cat migration-output.txt
          exit $status

      - name: Commit migration diagnostics
        if: failure()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add migration-output.txt
          git commit -m "Capture portfolio migration failure" || exit 0
          git push origin feature/portfolio-editorial-refinement

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Screenshot QA
        run: npm run qa:screens:headless

      - name: Diff check
        run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src public/overview/mirror-checkin-flow.svg
          git commit -m "Refine portfolio hierarchy and flagship case proof" || exit 0
          git push origin feature/portfolio-editorial-refinement
