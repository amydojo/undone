name: Capture current case heroes

on:
  push:
    branches:
      - polish/case-hero-layout-only-2026-08-07
    paths:
      - .github/workflows/capture-current-case-heroes.yml
      - src/components/portfolio/OverviewVisualPlate.jsx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[hero capture]')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture current live hero states
        run: |
          mkdir -p public/overview
          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1200, height: 750 },
            deviceScaleFactor: 2,
          });

          async function settle(page) {
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.waitForTimeout(900);
            await page.evaluate(async () => {
              if (document.fonts?.ready) await document.fonts.ready;
            });
          }

          // Interface Behavior Lab: preserve the live Intent specimen itself,
          // framed as a portfolio faceplate rather than a full-page screenshot.
          {
            const page = await context.newPage();
            await page.goto('https://interface-behavior-lab.vercel.app/', { waitUntil: 'domcontentloaded' });
            await page.locator('.ld-living-specimen').waitFor({ state: 'visible' });
            await settle(page);

            await page.evaluate(() => {
              const specimen = document.querySelector('.ld-living-specimen')?.cloneNode(true);
              if (!specimen) throw new Error('Intent specimen preview not found');

              const capture = document.createElement('main');
              capture.id = 'portfolio-hero-capture';
              capture.append(specimen);
              document.body.replaceChildren(capture);

              const style = document.createElement('style');
              style.textContent = `
                html, body {
                  margin: 0 !important;
                  width: 1200px !important;
                  height: 750px !important;
                  overflow: hidden !important;
                  background: #f2efe5 !important;
                }
                #portfolio-hero-capture {
                  position: relative;
                  width: 1200px;
                  height: 750px;
                  overflow: hidden;
                  background: #f2efe5;
                }
                #portfolio-hero-capture .ld-living-specimen {
                  position: absolute !important;
                  top: 55px !important;
                  left: 50% !important;
                  width: 710px !important;
                  min-width: 710px !important;
                  max-width: 710px !important;
                  min-height: 820px !important;
                  margin: 0 !important;
                  transform: translateX(-50%) !important;
                  box-sizing: border-box !important;
                }
              `;
              document.head.append(style);
            });

            await page.screenshot({
              path: 'public/overview/interface-behavior-lab-live.png',
              fullPage: false,
              animations: 'disabled',
              caret: 'hide',
            });
            await page.close();
          }

          // Type Archive: preserve the live Decision Receipt thesis and artifact,
          // cropped to the part that communicates the product at thumbnail scale.
          {
            const page = await context.newPage();
            await page.goto('https://type-archive.vercel.app/', { waitUntil: 'domcontentloaded' });
            await page.locator('#receipt-story').waitFor({ state: 'visible' });
            await settle(page);

            await page.evaluate(() => {
              const intro = document.querySelector('#receipt-story .section-intro')?.cloneNode(true);
              const receipt = document.querySelector('#receipt-story .receipt-demo')?.cloneNode(true);
              if (!intro || !receipt) throw new Error('Decision receipt hero source not found');

              const capture = document.createElement('main');
              capture.id = 'portfolio-hero-capture';
              capture.append(intro, receipt);
              document.body.replaceChildren(capture);

              const style = document.createElement('style');
              style.textContent = `
                html, body {
                  margin: 0 !important;
                  width: 1200px !important;
                  height: 750px !important;
                  overflow: hidden !important;
                  background: #0b0b0b !important;
                  color: #f2efe7 !important;
                }
                #portfolio-hero-capture {
                  width: 1200px;
                  height: 750px;
                  box-sizing: border-box;
                  overflow: hidden;
                  padding: 62px 8px 0;
                  background: #0b0b0b;
                }
                #portfolio-hero-capture .section-intro {
                  display: block !important;
                  margin: 0 0 38px !important;
                  max-width: 760px !important;
                }
                #portfolio-hero-capture .section-intro .kicker {
                  margin: 0 0 27px !important;
                  color: #9b9992 !important;
                  font: 600 10px/1.3 var(--mono) !important;
                  letter-spacing: .12em !important;
                  text-transform: uppercase !important;
                }
                #portfolio-hero-capture .section-intro h2 {
                  margin: 0 0 22px !important;
                  max-width: 700px !important;
                  color: #f2efe7 !important;
                  font: 400 66px/.88 var(--serif) !important;
                  letter-spacing: -.06em !important;
                }
                #portfolio-hero-capture .section-intro > p:last-child {
                  margin: 0 !important;
                  max-width: 590px !important;
                  color: #9b9992 !important;
                  font-size: 17px !important;
                  line-height: 1.55 !important;
                  letter-spacing: -.01em !important;
                }
                #portfolio-hero-capture .receipt-demo {
                  width: 870px !important;
                  min-height: 178px !important;
                  box-sizing: border-box !important;
                  margin: 0 !important;
                  padding: 31px 35px 29px !important;
                  transform: rotate(-.7deg) !important;
                  transform-origin: left center !important;
                  background: #e9e2d3 !important;
                  color: #11100d !important;
                  box-shadow: 0 20px 48px rgba(0,0,0,.18) !important;
                }
                #portfolio-hero-capture .receipt-demo span {
                  display: block !important;
                  margin-bottom: 19px !important;
                  font: 600 10px/1.3 var(--mono) !important;
                  letter-spacing: .11em !important;
                }
                #portfolio-hero-capture .receipt-demo strong {
                  display: block !important;
                  max-width: 800px !important;
                  font-size: 31px !important;
                  line-height: 1.05 !important;
                  letter-spacing: -.035em !important;
                }
                #portfolio-hero-capture .receipt-demo p {
                  margin: 27px 0 0 !important;
                  font-size: 16px !important;
                  line-height: 1.4 !important;
                }
              `;
              document.head.append(style);
            });

            await page.screenshot({
              path: 'public/overview/type-archive-live.png',
              fullPage: false,
              animations: 'disabled',
              caret: 'hide',
            });
            await page.close();
          }

          await browser.close();
          EOF

      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/overview/interface-behavior-lab-live.png public/overview/type-archive-live.png
          if git diff --cached --quiet; then
            echo "Hero screenshots are already current."
            exit 0
          fi
          git commit -m "[hero capture] Refresh current case hero screenshots"
          git push origin HEAD:${GITHUB_REF_NAME}
